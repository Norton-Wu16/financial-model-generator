<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    var useState = React.useState;
    var useEffect = React.useEffect;

    // ==================== Model definitions ====================
    var MODELS = {
      three_statement: {
        name: "三表联动模型", en: "Three-Statement Model", icon: "📊",
        desc: "利润表/资产负债表/现金流量表互相链接的完整三表联动预测模型"

      dcf: {
        name: "DCF 现金流折现", en: "Discounted Cash Flow", icon: "💰",

        desc: "Sources&Uses + 债务滚动 + CFADS + IRR/MoIC 回报分析模型"
      }

    // Parameter groups: [group_name, [{name, label, type, group}, ...]]
    // type: "number" | "percent" | "text" | "select" | "int"
    var PARAM_GROUPS = {
      three_statement: [
        ["公司信息 Company", [
          { name: "company_name", label: "公司名称 Company Name", type: "text" },
          { name: "projection_years", label: "预测年数 Projection Years (1-10)", type: "int" },
        ]],
        ["收入与利润率 Revenue & Margins", [
          { name: "revenue_y0", label: "基期收入 Year 0 Revenue", type: "number" },
          { type: "percent_yearly", base: "rev_growth", label: "收入增长率 Revenue Growth" },
          { type: "percent_toggle", name: "cogs_pct", label: "COGS % 成本率" },
          { type: "percent_toggle", name: "sga_pct", label: "SG&A % 销管费用率" },
          { type: "percent_toggle", name: "rd_pct", label: "R&D % 研发费用率" },
          { type: "percent_toggle", name: "da_pct", label: "D&A % 折旧摊销率" },
          { name: "interest_rate", label: "债务利率 Interest Rate", type: "percent" },
          { name: "tax_rate", label: "税率 Tax Rate", type: "percent" },
          { name: "tax_basis", label: "税率口径 Tax Basis", type: "tax_basis" },
          { name: "dividend_pct", label: "股利分配率 Dividend Payout", type: "percent" },
          { type: "percent_toggle", name: "capex_pct", label: "CapEx % 资本支出率" },
        ]],
        ["营运资本天数 Working Capital Days", [
          { name: "dso", label: "DSO 应收天数", type: "number" },
          { name: "dio", label: "DIO 库存天数", type: "number" },
          { name: "dpo", label: "DPO 应付天数", type: "number" },
          { name: "accrued_days", label: "应计费用天数 Accrued Days", type: "number" },
        ]],
        ["期初资产负债表 Beginning BS", [
          { name: "beg_cash", label: "期初现金 Beginning Cash", type: "number" },
          { name: "beg_ar", label: "期初应收 Beginning AR", type: "number" },
          { name: "beg_inventory", label: "期初库存 Beginning Inventory", type: "number" },
          { name: "beg_ppe", label: "期初固定资产 Beginning PP&E", type: "number" },
          { name: "beg_ap", label: "期初应付 Beginning AP", type: "number" },
          { name: "beg_accrued", label: "期初应计 Beginning Accrued", type: "number" },
          { name: "beg_debt", label: "期初债务 Beginning Debt", type: "number" },
          { name: "common_stock", label: "普通股 Common Stock", type: "number" },
          { name: "beg_retn_earn", label: "期初留存收益 Beginning RE", type: "number" },
          { name: "new_debt_issuance", label: "新增债务发行 New Debt", type: "number" },
        ]],
      ],
      dcf: [
        ["公司信息 Company", [
          { name: "company_name", label: "公司名称 Company Name", type: "text" },
          { name: "projection_years", label: "预测年数 Projection Years", type: "int" },
        ]],
        ["运营假设 Operating", [
          { name: "revenue_y0", label: "基期收入 Year 0 Revenue", type: "number" },
          { type: "percent_yearly", base: "rev_growth", label: "收入增长率 Revenue Growth" },
          { type: "percent_yearly", base: "ebitda_margin", label: "EBITDA 利润率 EBITDA Margin" },
          { type: "percent_toggle", name: "da_pct", label: "D&A % 折旧摊销率" },
          { type: "percent_toggle", name: "capex_pct", label: "CapEx % 资本支出率" },
          { type: "percent_toggle", name: "nwc_pct", label: "NWC % 净营运资本率" },
          { name: "tax_rate", label: "税率 Tax Rate", type: "percent" },
          { name: "tax_basis", label: "税率口径 Tax Basis", type: "tax_basis" },
        ]],
        ["WACC 资本成本 Capital Structure", [
          { name: "risk_free_rate", label: "无风险利率 Rf", type: "percent" },
          { name: "equity_risk_premium", label: "股权风险溢价 ERP", type: "percent" },
          { name: "beta", label: "Beta", type: "number" },
          { name: "pre_tax_cost_of_debt", label: "税前债务成本 Kd (Pre-tax)", type: "percent" },
          { name: "debt_weight", label: "债务权重 Wd", type: "percent" },
          { name: "cost_of_preferred", label: "优先股成本 Kp (股息率)", type: "percent" },
          { name: "preferred_weight", label: "优先股权重 Wp", type: "percent" },
          { type: "equity_weight_auto" },
          { name: "preferred_stock", label: "优先股金额 Preferred Stock（同时在 EV→普通股 桥中扣除）", type: "number" },
        ]],
        ["终值 Terminal Value", [
          { name: "terminal_growth", label: "终值增长率 g", type: "percent" },
          { name: "exit_multiple", label: "退出 EV/EBITDA 倍数", type: "number" },
          { name: "tv_method", label: "终值方法 TV Method", type: "select", options: ["gordon", "exit"] },
        ]],
        ["EV→Equity 桥", [
          { name: "net_debt", label: "总债务 Total Debt", type: "number" },
          { name: "cash", label: "现金 Cash", type: "number" },
          { name: "minority_interest", label: "少数股东权益 Minority", type: "number" },
          { name: "stock_based_comp", label: "股权激励 SBC", type: "number" },
          { name: "pension_deficit", label: "养老金缺口 Pension", type: "number" },
          { name: "shares_outstanding", label: "流通股本(M) Shares", type: "number" },
          { name: "current_price", label: "当前股价 Current Price", type: "number" },
          { name: "valuation_timing", label: "估值时点 Timing", type: "select", options: ["mid", "end"] },
        ]],
      ],
      lbo: [
        ["交易假设 Transaction", [
          { name: "company_name", label: "公司名称 Company Name", type: "text" },
          { name: "ltm_revenue", label: "LTM 收入 LTM Revenue", type: "number" },
          { name: "ltm_ebitda", label: "LTM EBITDA", type: "number" },
          { name: "entry_ev_ebitda", label: "入场 EV/EBITDA 倍数", type: "number" },
          { name: "existing_net_debt", label: "现有净债务 Existing Net Debt", type: "number" },
          { name: "existing_cash", label: "现有现金 Existing Cash", type: "number" },
          { name: "transaction_fees", label: "交易费用 Transaction Fees", type: "number" },
          { name: "financing_fees", label: "融资费用 Financing Fees", type: "number" },
        ]],
        ["资本结构 Capital Structure", [
          { name: "sponsor_equity", label: "Sponsor 股权", type: "number" },
          { name: "revolver_capacity", label: "Revolver 额度", type: "number" },
          { name: "term_loan_a", label: "Term Loan A", type: "number" },
          { name: "term_loan_b", label: "Term Loan B", type: "number" },
          { name: "senior_notes", label: "Senior Notes", type: "number" },
          { name: "subordinated_debt", label: "Subordinated Debt", type: "number" },
        ]],
        ["利率 Interest Rates", [
          { name: "revolver_rate", label: "Revolver 利率", type: "percent" },
          { name: "tla_rate", label: "Term Loan A 利率", type: "percent" },
          { name: "tlb_rate", label: "Term Loan B 利率", type: "percent" },
          { name: "senior_notes_rate", label: "Senior Notes 利率", type: "percent" },
          { name: "sub_rate", label: "Subordinated 利率", type: "percent" },
        ]],
        ["偿债 Debt Repayment", [
          { name: "tla_mandatory_amort", label: "TLA 强制摊销 %", type: "percent" },
          { name: "tlb_mandatory_amort", label: "TLB 强制摊销 %", type: "percent" },
          { name: "cash_sweep_pct", label: "现金清偿 % Cash Sweep", type: "percent" },
          { name: "min_cash_balance", label: "最低现金余额 Min Cash", type: "number" },
        ]],
        ["运营 Operating", [
          { type: "percent_yearly", base: "rev_growth", label: "收入增长率 Revenue Growth" },
          { type: "percent_toggle", name: "ebitda_margin", label: "EBITDA 利润率 EBITDA Margin" },
          { type: "percent_toggle", name: "da_pct", label: "D&A % 折旧摊销率" },
          { type: "percent_toggle", name: "capex_pct", label: "CapEx % 资本支出率" },
          { type: "percent_toggle", name: "nwc_pct", label: "ΔNWC % 净营运资本率" },
          { name: "tax_rate", label: "税率 Tax Rate", type: "percent" },
          { name: "tax_basis", label: "税率口径 Tax Basis", type: "tax_basis" },
        ]],
        ["退出 Exit", [
          { name: "exit_ev_ebitda", label: "退出 EV/EBITDA 倍数", type: "number" },
          { name: "exit_year", label: "退出年/预测年数 Exit Year (1-10)", type: "int" },
          { name: "cash_interest_rate", label: "现金存款利率 Cash Int Rate", type: "percent" },
        ]],
      ],
    };

    // ==================== Helper: transform values ====================
    function isPercent(field) { return field.type === "percent"; }
    function isInt(field) { return field.type === "int"; }

    // 预测年数：三表/DCF 取 projection_years，LBO 取 exit_year（表单值/参数值均可）
    function yearNOf(modelType, obj) {
      var key = modelType === "lbo" ? "exit_year" : "projection_years";
      var v = parseInt(obj ? obj[key] : 0, 10);
      return Math.max(1, Math.min(10, isNaN(v) ? 5 : v));
    }

    // 判断某 percent_toggle 比率是否已按年展开（对象中存在 base_y1 即视为开启）
    function ratioToggleOn(base, obj) {
      return obj[base + "_y1"] !== undefined && obj[base + "_y1"] !== "";
    }

    // 从参数/表单推断单个字段组内全部 toggle 开关
    function inferToggles(fields, obj) {
      var t = {};
      fields.forEach(function(f) {
        if (f.type === "percent_toggle" && ratioToggleOn(f.name, obj)) t[f.name] = true;
      });
      return t;
    }

    // 始终按年的字段 base（收入增长率；DCF 还有 EBITDA 利润率）
    function yearlyBases(modelType) {
      return modelType === "dcf" ? ["rev_growth", "ebitda_margin"] : ["rev_growth"];
    }

    // 展开字段描述符为平铺字段：percent_yearly 展开 Y1..YN；percent_toggle 按开关展开
    function flattenFields(fields, yearN, toggles) {
      var out = [];
      fields.forEach(function(f) {
        if (f.type === "percent_yearly") {
          for (var i = 1; i <= yearN; i++) {
            out.push({ name: f.base + "_y" + i, label: f.label + " Y" + i, type: "percent" });
          }
        } else if (f.type === "percent_toggle") {
          if (toggles[f.name]) {
            for (var j = 1; j <= yearN; j++) {
              out.push({ name: f.name + "_y" + j, label: f.label + " Y" + j, type: "percent" });
            }
          } else {
            out.push({ name: f.name, label: f.label, type: "percent" });
          }
        } else {
          out.push(f);
        }
      });
      return out;
    }

    function defaultsToForm(defaults, groups, modelType) {
      var form = {};
      var yearN = yearNOf(modelType, defaults);
      for (var gi = 0; gi < groups.length; gi++) {
        var fields = groups[gi][1];
        var toggles = inferToggles(fields, defaults);
        var flat = flattenFields(fields, yearN, toggles);
        for (var fi = 0; fi < flat.length; fi++) {
          var f = flat[fi];
          var v = defaults[f.name];
          if (v === undefined || v === null) {
            // 年度字段缺省时沿用上一年（新增年数场景），其余给空/0
            var m = /^(.*)_y(\d+)$/.exec(f.name);
            if (m && parseInt(m[2], 10) > 1) v = defaults[m[1] + "_y" + (parseInt(m[2], 10) - 1)];
            if (v === undefined) v = (f.type === "percent") ? 0 : "";
          }
          if (isPercent(f)) { v = (parseFloat(v) || 0) * 100; }
          form[f.name] = v;
        }
      }
      return form;
    }

    function formToApi(form, groups, modelType, customItems) {
      var api = {};
      var yearN = yearNOf(modelType, form);
      for (var gi = 0; gi < groups.length; gi++) {
        var fields = groups[gi][1];
        var toggles = inferToggles(fields, form);
        var flat = flattenFields(fields, yearN, toggles);
        for (var fi = 0; fi < flat.length; fi++) {
          var f = flat[fi];
          if (f.type === "equity_weight_auto") continue; // 自动计算值，不提交
          var v = form[f.name];
          if (f.type === "text" || f.type === "select" || f.type === "tax_basis") {
            api[f.name] = (v === undefined || v === "") ? (f.type === "tax_basis" ? "mtr" : v) : v;
          } else if (isPercent(f)) {
            api[f.name] = parseFloat(v) / 100;
          } else if (isInt(f)) {
            api[f.name] = parseInt(v, 10);
          } else {
            api[f.name] = parseFloat(v);
          }
          if (isNaN(api[f.name]) && f.type !== "text" && f.type !== "select" && f.type !== "tax_basis") {
            api[f.name] = 0;
          }
        }
      }
      // 自定义行项
      if (customItems && customItems.length > 0) {
        api.custom_items = customItems.map(function(ci) {
          return {
            name: ci.name || "",
            formula: ci.formula || "",
            target_sheet: ci.target_sheet || "",
            format: ci.format || "number",
          };
        });
      }
      return api;
    }

    // ==================== Components ====================
    function ModelSelector(props) {
      var keys = Object.keys(MODELS);
      return React.createElement("div", { className: "max-w-5xl mx-auto px-4 py-8" },
        React.createElement("h2", { className: "text-xl font-semibold text-slate-300 mb-6" }, "选择模型 Select a Model"),
        React.createElement("div", { className: "grid md:grid-cols-3 gap-6" },
          keys.map(function(k) {
            var m = MODELS[k];
            return React.createElement("button", {
              key: k,
              onClick: function() { props.onSelect(k); },
              className: "bg-slate-800 border border-slate-700 rounded-xl p-6 text-left hover:border-blue-500 hover:bg-slate-750 transition-all shadow-lg"
            },
              React.createElement("div", { className: "text-4xl mb-3" }, m.icon),
              React.createElement("h3", { className: "text-lg font-bold text-white mb-1" }, m.name),
              React.createElement("p", { className: "text-sm text-slate-400 font-mono mb-2" }, m.en),
              React.createElement("p", { className: "text-xs text-slate-500 mt-2" }, m.desc)
            );
          })
        )
      );
    }

    function FieldInput(props) {
      var field = props.field;
      var value = props.value;
      var onChange = props.onChange;

      if (field.type === "select") {
        return React.createElement("select", {
          value: value,
          onChange: function(e) { onChange(e.target.value); },
          className: "w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none"
        }, (field.options || []).map(function(opt) {
          return React.createElement("option", { key: opt, value: opt }, opt);
        }));
      }
      return React.createElement("input", {
        type: field.type === "text" ? "text" : "number",
        step: field.type === "int" ? "1" : "0.01",
        value: value,
        onChange: function(e) { onChange(e.target.value); },
        className: "w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-blue-300 font-mono focus:border-blue-500 focus:outline-none"
      });
    }

    // ETR / MTR 税率口径分段选择
    function TaxBasisInput(props) {
      var value = props.value || "mtr";
      var onChange = props.onChange;
      var opts = [
        { v: "etr", label: "ETR", hint: "有效税率 Effective Tax Rate：利润表实际税负" },
        { v: "mtr", label: "MTR", hint: "边际税率 Marginal Tax Rate：法定税率，用于 NOPAT / WACC" },
      ];
      return React.createElement("div", null,
        React.createElement("div", { className: "flex rounded border border-slate-600 overflow-hidden" },
          opts.map(function(o) {
            var active = value === o.v;
            return React.createElement("button", {
              key: o.v, type: "button",
              onClick: function() { onChange(o.v); },
              className: "flex-1 px-2 py-1.5 text-xs font-bold transition " +
                (active ? "bg-blue-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600")
            }, o.label);
          })
        ),
        React.createElement("p", { className: "text-[10px] text-slate-500 mt-1 leading-tight" },
          (value === "etr" ? opts[0].hint : opts[1].hint)
        )
      );
    }

    // ==================== Helpers for preview ====================
    function fmtNum(v, digits) {
      if (digits === undefined) digits = 2;
      if (v === null || v === undefined || v === "") return "—";
      var n = typeof v === "number" ? v : parseFloat(v);
      if (isNaN(n)) return String(v);
      // 千分位
      return n.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }
    function fmtPct(v, digits) {
      if (digits === undefined) digits = 1;
      if (v === null || v === undefined) return "—";
      var n = typeof v === "number" ? v : parseFloat(v);
      if (isNaN(n)) return String(v);
      return (n * 100).toFixed(digits) + "%";
    }

    // 通用指标表: rows = [{label, values:[...], bold?, color?}]
    function MetricTable(props) {
      var years = props.years;
      var rows = props.rows;
      return React.createElement("div", { className: "overflow-x-auto" },
        React.createElement("table", { className: "w-full text-sm font-mono" },
          React.createElement("thead", null,
            React.createElement("tr", { className: "border-b border-slate-700 text-slate-400" },
              React.createElement("th", { className: "text-left py-2 pr-4 font-medium" }, "指标 Metric"),
              years.map(function(y, i) {
                return React.createElement("th", { key: i, className: "text-right py-2 px-2 font-medium" }, "Y" + y);
              })
            )
          ),
          React.createElement("tbody", null,
            rows.map(function(row, ri) {
              var cls = "border-b border-slate-800 " + (row.bold ? "text-slate-100 font-semibold" : "text-slate-300");
              if (row.color) cls += " text-" + row.color + "-400";
              return React.createElement("tr", { key: ri, className: cls },
                React.createElement("td", { className: "py-1.5 pr-4" }, row.label),
                row.values.map(function(v, vi) {
                  return React.createElement("td", { key: vi, className: "text-right py-1.5 px-2" }, v);
                })
              );
            })
          )
        )
      );
    }

    function PreviewPanel(props) {
      var modelType = props.modelType;
      var params = props.params;
      var onBack = props.onBack;

      var dataState = useState(null);
      var errState = useState("");
      var loadState = useState(true);
      var data = dataState[0]; var setData = dataState[1];
      var err = errState[0]; var setErr = errState[1];
      var loading = loadState[0]; var setLoading = loadState[1];

      var canvasRef = React.useRef(null);
      var chartRef = React.useRef(null);

      useEffect(function() {
        setLoading(true);
        setErr("");
        try {
          var d = jsCalculate(modelType, params);
          setData(d);
          setLoading(false);
        } catch(e) {
          setErr("预览失败: " + e.message);
          setLoading(false);
        }
      }, [modelType, JSON.stringify(params)]);

      // 渲染 Chart.js 折线图
      useEffect(function() {
        if (!data || !canvasRef.current) return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }

        var ctx = canvasRef.current.getContext("2d");
        var years = data.years.map(function(y) { return "Y" + y; });
        var datasets;

    function ScenarioCompare(props) {
      var modelType = props.modelType;

      // 创建三套场景参数（基于当前表单，保守/基准/乐观）；随预测年数动态生成 Y1..Yn
      function makeScenario(base, type) {
        var s = Object.assign({}, base);
        var n = yearNOf(modelType, base);
        var growthKeys = [];
        for (var gy = 1; gy <= n; gy++) growthKeys.push("rev_growth_y" + gy);
        // EBITDA 利润率：DCF 始终按年；LBO 统一值 + 可能的按年细化；三表无此项
        var marginKeys = [];
        if (modelType === "dcf") {
          for (var my = 1; my <= n; my++) marginKeys.push("ebitda_margin_y" + my);
        } else if (modelType === "lbo") {
          marginKeys.push("ebitda_margin");
          for (var my2 = 1; my2 <= n; my2++) marginKeys.push("ebitda_margin_y" + my2);
        }
        // 成本/费用率：统一值始终调整；若已按年细化（存在 _y1 键）则各年一并调整
        var costBases = modelType === "three_statement"
          ? ["cogs_pct", "sga_pct", "rd_pct", "da_pct", "capex_pct"]
          : ["da_pct", "capex_pct", "nwc_pct"];
        var costKeys = [];
        costBases.forEach(function(b) {
          costKeys.push(b);
          for (var cy = 1; cy <= n; cy++) {
            var k = b + "_y" + cy;
            if (s[k] !== undefined && s[k] !== "") costKeys.push(k);
          }
        });
        var gAdj = type === "conservative" ? -5 : (type === "optimistic" ? 5 : 0);
        var cAdj = type === "conservative" ? 3 : (type === "optimistic" ? -3 : 0);
        var mAdj = -cAdj;
        function adj(keys, delta) {
          if (!delta) return;
          keys.forEach(function(k) {
            if (s[k] !== undefined && s[k] !== "") {
              var v = parseFloat(s[k]);
              if (!isNaN(v)) s[k] = v + delta;
            }
          });
        }
        adj(growthKeys, gAdj);
        adj(costKeys, cAdj);
        adj(marginKeys, mAdj);
        return s;
      }

      var setForms = [setConForm, setBaseForm2, setOptForm];
      var currentForm = forms[tab];
      var currentSet = setForms[tab];

      var scenarioNames = [
        { name: "保守 Conservative", color: "red", icon: "📉" },
        { name: "基准 Base Case", color: "blue", icon: "📊" },
        { name: "乐观 Optimistic", color: "green", icon: "📈" },

      function runComparison() {

        var paramsList = forms.map(function(f) { return formToApi(f, groups, modelType, customItems); });
        try {

          setLoading(false);
        }

      // 提取关键指标用于对比
      function getKeyMetrics(data) {
        var rows;
        if (modelType === "three_statement") {
          var n = data.years.length - 1;
          rows = [
            { label: "Y" + n + " Revenue 收入", con: results ? null : null, values: [data.income_statement.revenue[n]] },
            { label: "Y" + n + " EBITDA", values: [data.income_statement.ebitda[n]] },
            { label: "Y" + n + " Net Income 净利", values: [data.income_statement.net_income[n]] },
            { label: "Y" + n + " EBITDA Margin", values: [data.key_metrics.ebitda_margin[n]], isPct: true },
            { label: "Y" + n + " Net Margin", values: [data.key_metrics.net_margin[n]], isPct: true },
            { label: "平衡校验", values: [data.balance_sheet.balance_check.every(function(s) { return s === "BALANCED"; }) ? "BALANCED" : "OUT OF BALANCE"] },
          ];

        var next = Object.assign({}, formData, formVals);
        var allFields = groups.reduce(function(acc, g) { return acc.concat(g[1]); }, []);
        setRatioToggles(inferToggles(allFields, next));
        setFormData(next);
      }

      function preview() {
        setView("preview");
      }

      function compare() {
        setView("compare");
      }

      function backToForm() {
        setView("form");
      }

      function generate() {
        setGenerating(true);
        setErr("");
        try {
          var params = formToApi(formData, groups, modelType, customItems);
          if (modelType === "dcf" && waccInvalid(params)) {
            setErr("WACC 权重错误：债务权重 Wd + 优先股权重 Wp 不能超过 100%");
            setGenerating(false);
            return;
          }
          Promise.resolve(jsBuildExcel(modelType, params)).then(function(blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = modelType === "three_statement" ? "Three_Statement_Model.xlsx" :
                         modelType === "dcf" ? "DCF_Model.xlsx" : "LBO_Model.xlsx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setGenerating(false);
          }).catch(function(e) {
            setErr("生成失败: " + e.message);
            setGenerating(false);
          });
        } catch(e) {
            setErr("生成失败: " + e.message);
            setGenerating(false);
        }
      }

      if (isLoading) {
        return React.createElement("div", { className: "flex justify-center py-20" },
          React.createElement("div", { className: "text-slate-400 animate-pulse text-lg" }, "加载参数中 Loading...")
        );
      }

      // 预览模式: 渲染 PreviewPanel
      if (view === "preview") {
        var params = formToApi(formData, groups, modelType, customItems);
        return React.createElement(PreviewPanel, {
          modelType: modelType,
          params: params,
          onBack: backToForm
        });
      }

      // 场景对比模式: 渲染 ScenarioCompare
      if (view === "compare") {
        return React.createElement(ScenarioCompare, {
          modelType: modelType,
          baseForm: formData,
          customItems: customItems,
          onBack: backToForm
        });
      }

      var m = MODELS[modelType];
      var yearN = yearNOf(modelType, formData);

      // DCF WACC 实时权重与校验
      var wdPct = parseFloat(formData.debt_weight); if (isNaN(wdPct)) wdPct = 0;
      var wpPct = parseFloat(formData.preferred_weight); if (isNaN(wpPct)) wpPct = 0;
      var wePct = 100 - wdPct - wpPct;
      var wInvalid = modelType === "dcf" && wePct < -0.001;

      // 渲染单个字段描述符（动态类型展开为一个或多个 grid 单元）
      function renderField(f, fi) {
        if (f.type === "percent_yearly") {
          var cells = [];
          for (var yi = 1; yi <= yearN; yi++) {
            (function(base, idx) {
              var name = base + "_y" + idx;
              cells.push(React.createElement("div", { key: "py-" + base + "-" + idx },
                React.createElement("label", { className: "block text-xs text-slate-400 mb-1" }, f.label + " Y" + idx),
                React.createElement(FieldInput, {
                  field: { type: "percent" },
                  value: formData[name] !== undefined ? formData[name] : "",
                  onChange: function(v) { updateField(name, v); }
                }),
                React.createElement("span", { className: "text-xs text-slate-500 ml-1" }, "%")
              ));
            })(f.base, yi);
          }
          return cells;
        }

        if (f.type === "percent_toggle") {
          var on = !!ratioToggles[f.name];
          var inner = [];
          if (on) {
            for (var yj = 1; yj <= yearN; yj++) {
              (function(base, idx) {
                var k = base + "_y" + idx;
                inner.push(React.createElement("div", { key: k },
                  React.createElement("label", { className: "block text-[11px] text-slate-400 mb-1" }, "Y" + idx),
                  React.createElement(FieldInput, {
                    field: { type: "percent" },
                    value: formData[k] !== undefined ? formData[k] : "",
                    onChange: function(v) { updateField(k, v); }
                  }),
                  React.createElement("span", { className: "text-xs text-slate-500 ml-1" }, "%")
                ));
              })(f.name, yj);
            }
          } else {
            inner.push(React.createElement("div", { key: f.name, className: "w-40" },
              React.createElement(FieldInput, {
                field: { type: "percent" },
                value: formData[f.name] !== undefined ? formData[f.name] : "",
                onChange: function(v) { updateField(f.name, v); }
              })
            ));
          }
          return React.createElement("div", { key: "tg-" + f.name, className: "col-span-full border-t border-slate-700/60 pt-2 mt-1" },
            React.createElement("div", { className: "flex items-center justify-between mb-2" },
              React.createElement("label", { className: "block text-xs text-slate-300 font-medium" }, f.label),
              React.createElement("label", { className: "flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer select-none" },
                React.createElement("input", {
                  type: "checkbox", checked: on, className: "accent-blue-500 w-3.5 h-3.5",
                  onChange: function(e) { toggleRatio(f.name, e.target.checked); }
                }),
                "按年细化 Per-year（默认各年相同）"
              )
            ),
            React.createElement("div", { className: "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-x-4 gap-y-2" }, inner)
          );
        }

        if (f.type === "tax_basis") {
          return React.createElement("div", { key: "tb", className: "col-span-2" },
            React.createElement("label", { className: "block text-xs text-slate-400 mb-1" }, f.label),
            React.createElement(TaxBasisInput, {
              value: formData.tax_basis || "mtr",
              onChange: function(v) { updateField("tax_basis", v); }
            })
          );
        }

        if (f.type === "equity_weight_auto") {
          return React.createElement("div", { key: "we-auto" },
            React.createElement("label", { className: "block text-xs text-slate-400 mb-1" }, "普通股权重 We（自动 = 100% − Wd − Wp）"),
            React.createElement("input", {
              type: "text", readOnly: true, value: wePct.toFixed(1) + " %",
              className: "w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm font-mono " + (wInvalid ? "text-red-400" : "text-emerald-300")
            })
          );
        }

        return React.createElement("div", { key: f.name },
          React.createElement("label", { className: "block text-xs text-slate-400 mb-1" }, f.label),
          React.createElement(FieldInput, {
            field: f,
            value: formData[f.name] !== undefined ? formData[f.name] : "",
            onChange: function(v) { updateField(f.name, v); }
          }),
          isPercent(f) ? React.createElement("span", { className: "text-xs text-slate-500 ml-1" }, "%") : null
        );
      }

      return React.createElement("div", { className: "max-w-5xl mx-auto px-4 py-6" },
        // Header
        React.createElement("div", { className: "flex items-center justify-between mb-6" },
          React.createElement("div", { className: "flex items-center gap-3" },
            React.createElement("span", { className: "text-3xl" }, m.icon),
            React.createElement("div", null,
              React.createElement("h2", { className: "text-xl font-bold text-white" }, m.name),
              React.createElement("p", { className: "text-xs text-slate-400 font-mono" }, m.en)
            )
          ),
          React.createElement("button", {
            onClick: props.onBack,
            className: "px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm text-slate-200 transition"
          }, "← 返回 Back")
        ),
        // Error
        errMsg ? React.createElement("div", { className: "bg-red-900 border border-red-700 text-red-200 px-4 py-2 rounded mb-4 text-sm" }, errMsg) : null,
        // Preset Selector + File Upload
        React.createElement("div", { className: "grid md:grid-cols-2 gap-4" },
          React.createElement(PresetSelector, { modelType: modelType, onApply: applyPreset }),
          React.createElement(FileUpload, { modelType: modelType, onApply: applyUpload })
        ),
        // WACC 权重非法内联提示
        wInvalid ? React.createElement("div", { className: "bg-red-900/60 border border-red-600 text-red-200 px-4 py-2 rounded mb-3 text-sm mt-4" },
          "⚠ WACC 权重错误：债务权重 Wd(" + wdPct.toFixed(1) + "%) + 优先股权重 Wp(" + wpPct.toFixed(1) + "%) 超过 100%，请调整后再预览或生成。") : null,
        // Form groups
        React.createElement("div", { className: "space-y-6 mt-4" },
          groups.map(function(group, gi) {
            var gname = group[0];
            var fields = group[1];
            return React.createElement("div", {
              key: gi,
              className: "bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg"
            },
              React.createElement("h3", { className: "text-sm font-semibold text-blue-400 mb-4 uppercase tracking-wide" }, gname),
              React.createElement("div", { className: "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-3" },
                fields.map(function(f, fi) { return renderField(f, fi); })
              )
            );
          })
        ),
        // Custom Line Items Manager
        React.createElement("div", { className: "mt-6" },
          React.createElement(CustomItemManager, {
            items: customItems,
            onChange: setCustomItems,
            modelType: modelType,
            formData: formData,
            groups: groups
          })
        ),
        // Action bar: Preview + Compare + Generate
        React.createElement("div", { className: "sticky bottom-0 mt-6 py-4 bg-slate-900/95 backdrop-blur border-t border-slate-700" },
          React.createElement("div", { className: "flex flex-col sm:flex-row gap-3" },
            React.createElement("button", {
              onClick: preview,
              disabled: wInvalid,
              className: "flex-1 sm:flex-none px-6 py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-600 disabled:cursor-not-allowed rounded-lg font-semibold text-white shadow-lg transition"
            }, "📊 预览 Preview"),
            React.createElement("button", {
              onClick: compare,
              className: "flex-1 sm:flex-none px-6 py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-semibold text-white shadow-lg transition"
            }, "🔄 场景对比 Compare"),
            React.createElement("button", {
              onClick: generate,
              disabled: isGenerating || wInvalid,
              className: "flex-1 px-8 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-600 disabled:cursor-not-allowed rounded-lg font-semibold text-white shadow-lg transition"
            }, isGenerating ? "生成中 Generating..." : "⬇ 生成 Excel Generate")
          )
        )
      );
    }

    // ==================== App ====================
    function App() {
      var sel = useState(null);
      var selected = sel[0];
      var setSelected = sel[1];

      return React.createElement("div", { className: "min-h-screen" },
        // Top bar
        React.createElement("header", { className: "bg-slate-800 border-b border-slate-700 shadow-md" },
          React.createElement("div", { className: "max-w-5xl mx-auto px-4 py-4 flex items-center justify-between" },
            React.createElement("div", null,
              React.createElement("h1", { className: "text-lg font-bold text-white" }, "财务模型生成器"),
              React.createElement("p", { className: "text-xs text-slate-400 font-mono" }, "Financial Model Generator")
            ),
            React.createElement("div", { className: "flex items-center gap-2" },
              React.createElement("span", { className: "w-2 h-2 rounded-full bg-green-400" }),
              React.createElement("span", { className: "text-xs text-slate-400" }, "Online")
            )
          )
        ),
        // Content
        React.createElement("main", null,
          selected === null
            ? React.createElement(ModelSelector, { onSelect: setSelected })
            : React.createElement(ModelForm, { modelType: selected, onBack: function() { setSelected(null); } })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
